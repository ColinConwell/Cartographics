name: Publish Cartographics

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cartographics-pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Source Data and Local Dependencies
        run: |
          python3 scripts/validate_site.py
          node scripts/validate_maps.cjs
      - name: Assemble Public Site
        run: python3 scripts/build_site.py
      - name: Validate Assembled Site
        run: python3 scripts/validate_site.py --site _site
      - name: Upload Build for Branch Publishing
        uses: actions/upload-artifact@v4
        with:
          name: static-tree
          path: _site
          include-hidden-files: true
      - name: Upload Pages Artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  snapshot:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: static-tree
          path: _site
      - name: Stitch the Site onto gh-pages
        run: bash scripts/publish_branch.sh

  deploy:
    needs: [build, snapshot]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy the Same Validated Build
        id: deployment
        uses: actions/deploy-pages@v4
