name: Publish Cartographics

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cartographics-pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Source Data and Local Dependencies
        run: |
          python3 scripts/validate_site.py
          node scripts/validate_maps.cjs
      - name: Assemble Public Site
        run: python3 scripts/build_site.py
      - name: Validate Assembled Site
        run: python3 scripts/validate_site.py --site _site
      - name: Upload Build for Branch Publishing
        uses: actions/upload-artifact@v4
        with:
          name: static-tree
          path: _site
          include-hidden-files: true
      - name: Upload Pages Artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  snapshot:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: read
    steps:
      - uses: actions/checkout@v4
      - name: Check Pages Configuration
        if: ${{ !env.ACT }}
        uses: actions/configure-pages@v5
      - uses: actions/download-artifact@v4
        with:
          name: static-tree
          path: _site
      - name: Use a Local Publishing Remote in act
        if: ${{ env.ACT }}
        run: |
          git init --bare "$RUNNER_TEMP/pages-test.git"
          git remote set-url origin "$RUNNER_TEMP/pages-test.git"
      - name: Stitch the Site onto gh-pages
        run: bash scripts/publish_branch.sh
      - name: Verify Local Snapshot, History, and Stale File Removal in act
        if: ${{ env.ACT }}
        run: |
          git clone --branch gh-pages "$RUNNER_TEMP/pages-test.git" "$RUNNER_TEMP/pages-snapshot"
          diff -r --exclude=.git _site "$RUNNER_TEMP/pages-snapshot"
          before=$(git ls-remote origin refs/heads/gh-pages)
          bash scripts/publish_branch.sh
          test "$before" = "$(git ls-remote origin refs/heads/gh-pages)"
          touch "$RUNNER_TEMP/pages-snapshot/obsolete.txt"
          git -C "$RUNNER_TEMP/pages-snapshot" add obsolete.txt
          git -C "$RUNNER_TEMP/pages-snapshot" -c user.name=Test -c user.email=test@example.invalid commit -m Test
          git -C "$RUNNER_TEMP/pages-snapshot" push origin gh-pages
          previous=$(git -C "$RUNNER_TEMP/pages-snapshot" rev-parse HEAD)
          bash scripts/publish_branch.sh
          git -C "$RUNNER_TEMP/pages-snapshot" pull --ff-only
          git -C "$RUNNER_TEMP/pages-snapshot" merge-base --is-ancestor "$previous" HEAD
          diff -r --exclude=.git _site "$RUNNER_TEMP/pages-snapshot"

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [build, snapshot]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the Same Validated Build
        if: ${{ !env.ACT }}
        id: deployment
        uses: actions/deploy-pages@v4
